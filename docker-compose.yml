services:
  postgres:
    image: postgres:17
    container_name: moderation-postgres

    environment:
      POSTGRES_USER: moderation_user
      POSTGRES_PASSWORD: moderation_password
      POSTGRES_DB: moderation_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U moderation_user -d moderation_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  api:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: moderation-api

    environment:
      DATABASE_URL: postgresql+psycopg://moderation_user:moderation_password@postgres:5432/moderation_db
      MODEL_RUNTIME: onnx

    # Models stay outside the Docker image.
    # Docker mounts the local models directory read-only.
    volumes:
      - ./models:/app/models:ro

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: